# Gradle properties for SA-AIHOS Android project

# Enable AndroidX support (required for modern Jetpack dependencies)
android.useAndroidX=true

# Enable Jetpack Compose
android.enableCompose=true

# Gradle daemon settings
org.gradle.parallel=true
org.gradle.workers.max=8
org.gradle.caching=true

# Memory settings for Gradle daemon (compatible with Java 17)
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Kotlin compiler settings
kotlin.incremental=true
kotlin.stdlib.default.api=true
